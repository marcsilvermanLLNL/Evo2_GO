# Model training/evaluation config for the live 1342 completed-taxon
# embedding set with GO vocabulary min_count = 12000.
# Paths are resolved relative to --project-root.

build_id = "all_labels_true_path_live_human_test_min_count_12000_v1"
build_root = "outputs/builds"
run_name = "human_test_taxon_val_live_1342taxa_min_count_12000_bs256_mean_loss_3h"

# Use the live shared embedding root. The split manifest generated for this
# build fixes which embedded genes are used for train/val/test.
embedding_root = "outputs/builds/all_labels_true_path_42taxa_human_test_min_count_100_v1/data/embeddings"

[training]
train_split = "train"
val_split = "val"
batch_size = 256
num_workers = 8
max_steps = 200000
warmup_steps = 2000
validate_every = 5000
validation_batches = 0
checkpoint_every = 5000
log_every = 100
peak_lr = 3e-4
weight_decay = 0.01
loss_reduction = "mean"
loss_positive_weight = 1.0
loss_negative_weight = 1.0
device = "auto"
max_cached_shards = 2
stop_after_seconds = 10200

[evaluation]
split_name = "test"
batch_size = 256
num_workers = 8
threshold_steps = 100
device = "auto"
save_score_matrix = true
publication_metrics = true
