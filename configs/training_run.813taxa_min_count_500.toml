# Model training/evaluation config for the current 813 completed-taxon
# embedding set with GO vocabulary min_count = 500.
# Paths are resolved relative to --project-root.

build_id = "all_labels_true_path_813taxa_human_test_min_count_500_v1"
build_root = "outputs/builds"
run_name = "human_test_taxon_val_813taxa_min_count_500_bs256_mean_loss_v1"

# Embeddings are shared from the current completed 813-taxon build.
embedding_root = "outputs/builds/all_labels_true_path_42taxa_human_test_min_count_100_v1/data/embeddings"

[training]
train_split = "train"
val_split = "val"
batch_size = 256
num_workers = 8
max_steps = 200000
warmup_steps = 2000
validate_every = 5000
validation_batches = 0
checkpoint_every = 5000
log_every = 100
peak_lr = 3e-4
weight_decay = 0.01
loss_reduction = "mean"
loss_positive_weight = 1.0
loss_negative_weight = 1.0
device = "auto"
max_cached_shards = 2
stop_after_seconds = 21000

[evaluation]
split_name = "test"
batch_size = 256
num_workers = 8
threshold_steps = 100
device = "auto"
