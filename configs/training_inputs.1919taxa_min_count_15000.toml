# CPU-side training-input preparation for the frozen 1919 completed-taxon
# embedding set with GO vocabulary min_count = 15000.
# Paths are resolved relative to --project-root.

build_id = "all_labels_true_path_1919taxa_human_test_min_count_15000_v1"
build_root = "outputs/builds"

# Embeddings are shared from the live aggregate root, but selected genes and
# split taxa are frozen to the 1919 taxa completed when this build was started.
embedding_root = "outputs/builds/all_labels_true_path_42taxa_human_test_min_count_100_v1/data/embeddings"
selected_genes = "outputs/builds/all_labels_true_path_1919taxa_human_test_min_count_15000_v1/data/labels/selected_genes_1919taxa.tsv.gz"

length_filtered_cds_root = "outputs/map_gene_cds/length_filtered_max_8192"
annotations = "outputs/process_Gene2GO/processed/final/positive_gene_go_annotations.tsv.gz"
go_basic_obo = "data/go/go-basic.obo"

label_policy = "true_path_all_labels_including_iea"
include_iea = true
min_count = 15000
write_gene_labels = false

steps = [
  "true_path_counts",
  "go_adjacency",
  "label_cache",
  "split_manifest",
]

[split]
name = "human_test_taxon_val"
val_tax_ids = ["10116"]
test_tax_ids = ["9606"]
tax_ids_file = "outputs/builds/all_labels_true_path_1919taxa_human_test_min_count_15000_v1/data/embeddings_snapshot/frozen_complete_tax_ids_1919.txt"
seed = "evo2-go-human-taxon-holdout-v1"
expected_embedding_dim = 4096
drop_examples_without_labels = false

[validation]
expected_embedding_dim = 4096
tax_ids_file = "outputs/builds/all_labels_true_path_1919taxa_human_test_min_count_15000_v1/data/embeddings_snapshot/frozen_complete_tax_ids_1919.txt"
