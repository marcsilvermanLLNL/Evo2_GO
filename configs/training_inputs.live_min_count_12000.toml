# CPU-side training-input preparation using the current live shared embedding
# root, retaining GO terms with at least 12000 true-path labels.
# Paths are resolved relative to --project-root.
#
# Note: this intentionally uses the live embedding metadata. If more taxa
# complete before these steps run, they can be included in this build.

build_id = "all_labels_true_path_live_human_test_min_count_12000_v1"
build_root = "outputs/builds"

embedding_root = "outputs/builds/all_labels_true_path_42taxa_human_test_min_count_100_v1/data/embeddings"
selected_genes = "outputs/builds/all_labels_true_path_42taxa_human_test_min_count_100_v1/data/embeddings/embedding_metadata.tsv.gz"

length_filtered_cds_root = "outputs/map_gene_cds/length_filtered_max_8192"
annotations = "outputs/process_Gene2GO/processed/final/positive_gene_go_annotations.tsv.gz"
go_basic_obo = "data/go/go-basic.obo"

label_policy = "true_path_all_labels_including_iea"
include_iea = true
min_count = 12000
write_gene_labels = false

steps = [
  "true_path_counts",
  "go_adjacency",
  "label_cache",
  "split_manifest",
]

[split]
name = "human_test_taxon_val"
val_tax_ids = ["10116"]
test_tax_ids = ["9606"]
seed = "evo2-go-human-taxon-holdout-v1"
expected_embedding_dim = 4096
drop_examples_without_labels = false

[validation]
expected_embedding_dim = 4096
