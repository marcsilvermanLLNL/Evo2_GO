# Example CPU-side training-input preparation config.
# Paths are resolved relative to --project-root.
#
# This workflow starts from an existing shared embedding root and refreshes the
# rerunnable training artifacts: true-path counts, GO adjacency/vocabulary,
# vocabulary-aligned label cache, and split manifest. It intentionally does not
# rerun database preprocessing or Evo2 embedding extraction.

build_id = "all_labels_true_path_42taxa_human_test_min_count_100_v1"
build_root = "outputs/builds"

embedding_root = "outputs/builds/all_labels_true_path_42taxa_human_test_min_count_100_v1/data/embeddings"
selected_genes = "outputs/builds/all_labels_true_path_42taxa_human_test_min_count_100_v1/data/embeddings/embedding_metadata.tsv.gz"
length_filtered_cds_root = "outputs/map_gene_cds/length_filtered_max_8192"
annotations = "outputs/process_Gene2GO/processed/final/positive_gene_go_annotations.tsv.gz"
go_basic_obo = "data/go/go-basic.obo"

label_policy = "true_path_all_labels_including_iea"
include_iea = true
min_count = 100
write_gene_labels = false

steps = [
  "true_path_counts",
  "go_adjacency",
  "label_cache",
  "split_manifest",
]

[split]
name = "human_test_taxon_val"
val_tax_ids = ["10116"]
test_tax_ids = ["9606"]
seed = "evo2-go-human-taxon-holdout-v1"
expected_embedding_dim = 4096
# Keep every embedding record assigned in the split manifest. The dataset
# loader drops examples without retained labels during training.
drop_examples_without_labels = false

[validation]
# Optional step. Add "validate_embeddings" to steps or pass
# --steps validate_embeddings when you want this check.
expected_embedding_dim = 4096
# max_records = 1000
# max_shards = 20
# check_all_finite = true
